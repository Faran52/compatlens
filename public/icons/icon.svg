<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CompatLens">
  <title>CompatLens</title>
  <!-- A cobalt lens ring divided into four browser cells. The grid is clipped to the ring's inner
       edge so it reads as cells rather than as a crosshair, and it survives down to 16 px, the
       smallest size the manifest ships. -->
  <defs>
    <clipPath id="lens">
      <circle cx="64" cy="64" r="40" />
    </clipPath>
  </defs>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#315ee8" stroke-width="12" />
  <g clip-path="url(#lens)" stroke="#315ee8" stroke-width="11">
    <line x1="64" y1="18" x2="64" y2="110" />
    <line x1="18" y1="52" x2="110" y2="52" />
  </g>
</svg>
