name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The registry is committed. Regenerating it must produce no diff, or the pinned datasets and
      # the checked-in artifact have drifted apart.
      - run: pnpm generate
      - run: git diff --exit-code src/lib/compat-data/generatedRegistry.ts

      - run: pnpm playwright install --with-deps chromium
      - run: pnpm e2e

      - run: pnpm package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatlens-build
          path: |
            artifacts/*.zip
            test-results/*.png
          if-no-files-found: warn
