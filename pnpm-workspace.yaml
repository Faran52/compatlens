allowBuilds:
  sharp: true
  unrs-resolver: true
# A version-pinned entry goes stale the moment its dependency moves, and each family below publishes every part of
# itself together under one version, so pinning one part without the rest never installs anyway. The glob names the
# family and survives the next bump; a lone package still gets a pin.
minimumReleaseAgeExclude:
  - '@commitlint/*'
  - '@linteljs/*'
  - '@typescript-eslint/*'
  - typescript-eslint
  - '@mdn/browser-compat-data'
  - 'baseline-browser-mapping'
  - 'web-features'

# Two plugins stop their `eslint` peer range at 9 and both run: the solid layer loads its plugin's presets and names
# `jsx-a11y` rules. Neither has a version declaring 10, so an allowance is the only lever. Scoped with `>` so it
# reaches only the dependent named. `eslint-plugin-import` never runs; it arrives as an optional peer of the resolver.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-solid>eslint': '10'
